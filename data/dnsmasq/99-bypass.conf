# Skip Pi-hole for selected clients by hostname / DHCP tag.
# Replace the example MAC addresses and hostnames below with real devices on your network.
# Use the hostname that your client exposes via DHCP; if the client is using a fixed IP,
# the device should also be mapped to a DHCP tag so the bypass works consistently.

dhcp-host=aa:bb:cc:dd:ee:ff,media-box,set:skip_pihole
dhcp-host=11:22:33:44:55:66,printer,set:skip_pihole
dhcp-option=tag:skip_pihole,6,1.1.1.1,1.0.0.1
